name: Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Supabase v3 migrations (manual approval)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI v3.0.0
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Validate Supabase migration credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing production-db secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Missing production-db secret SUPABASE_DB_PASSWORD"
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::Missing production-db secret SUPABASE_PROJECT_REF"
            exit 1
          }

      - name: Migration dry run (remote production project)
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF"

      - name: Apply production migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --yes

  deploy:
    name: Deploy to Vercel (production)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production deployment
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
