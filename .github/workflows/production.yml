name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_mode:
        description: Choose one operation (dry_run checks only; apply_and_deploy releases DB, functions and website)
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - apply_and_deploy
          - deploy_only

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect Supabase migration changes
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.detect.outputs.migrations_changed }}
    steps:
      - name: Validate manual release mode
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            dry_run|apply_and_deploy|deploy_only) ;;
            *) echo "::error::Choose dry_run, apply_and_deploy, or deploy_only."; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed migration files
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" ]]; then
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
            echo "No push comparison is available; manual release mode controls migration handling."
            exit 0
          fi
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            echo "Initial push: require the Supabase migration safety job."
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/migrations/ | grep -q .; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            echo "This push changes Supabase migration files."
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase migration files changed; this is a code-only release."
          fi

  migrate:
    name: Supabase v3 migration dry-run / approved apply
    needs: [ci, changes]
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.migrations_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.release_mode == 'dry_run' || inputs.release_mode == 'apply_and_deploy'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-db
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI v3.0.0
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Validate Supabase migration credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::The production-db environment did not provide $name."
              exit 1
            fi
          done
          if [[ "$SUPABASE_PROJECT_REF" != "zilwgiuiygqqardzutxi" ]]; then
            echo "::error::SUPABASE_PROJECT_REF does not match this repository's reviewed StudioFlow project."
            exit 1
          fi
          echo "All three Supabase credential fields are present."

      - name: Link production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migration dry-run (remote production database)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply production migrations (manual apply_and_deploy only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'apply_and_deploy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy reviewed WhatsApp Edge Functions (manual apply_and_deploy only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'apply_and_deploy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        # Per-function JWT settings come from config.toml. Never globally
        # disable JWT verification or prune unrelated shared-project functions.
        run: >-
          supabase functions deploy
          nexora-whatsapp-connect nexora-whatsapp-webhook
          studioflow-payments studioflow-whatsapp-booking studioflow-booking-emails
          --remote="$SUPABASE_PROJECT_REF" --use-api

  deploy:
    name: Deploy to Vercel (production)
    needs: [ci, changes, migrate]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      needs.changes.result == 'success' &&
      (
        (github.event_name == 'push' &&
          needs.changes.outputs.migrations_changed == 'false' &&
          needs.migrate.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' &&
          inputs.release_mode == 'apply_and_deploy' &&
          needs.migrate.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          inputs.release_mode == 'deploy_only' &&
          inputs.release_mode != 'apply_and_deploy' &&
          needs.migrate.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Vercel deployment credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::The production environment did not provide $name."
              exit 1
            fi
          done
          echo "All three Vercel credential fields are present."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify linked Vercel project
        env:
          EXPECTED_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          EXPECTED_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.vercel/project.json';
          if (!fs.existsSync(file)) {
            console.error('Vercel pull did not create .vercel/project.json.');
            process.exit(1);
          }
          const linked = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (linked.orgId !== process.env.EXPECTED_VERCEL_ORG_ID ||
              linked.projectId !== process.env.EXPECTED_VERCEL_PROJECT_ID) {
            console.error('The downloaded Vercel project does not match the configured GitHub IDs.');
            process.exit(1);
          }
          console.log('Downloaded Vercel project identity matches the configured GitHub IDs.');
          NODE

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
