name: Refresh PGlite PostGIS test lockfile
on:
  push:
    branches:
      - feat/studioflow-security-center-staging-v2
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/studioflow-security-center-staging-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Generate locked PostGIS dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-pglite-postgis-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tests/database.test.mjs .github/workflows/refresh-pglite-postgis-lock.yml
          git commit -m 'test: install PostGIS extension for PGlite migrations'
          git push origin HEAD:feat/studioflow-security-center-staging-v2
