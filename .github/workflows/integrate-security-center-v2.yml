name: Integrate Security Center V2 (staging)
on:
  push:
    branches:
      - feat/studioflow-security-center-staging-v2
permissions:
  contents: write
jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studioflow-security-center-staging-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reassemble and extract V2 source package
        run: |
          cat .staging/chunks/* > .staging/security-center-v2-integrated.tar.gz.b64
          base64 --decode .staging/security-center-v2-integrated.tar.gz.b64 > .staging/security-center-v2-integrated.tar.gz
          tar -xzf .staging/security-center-v2-integrated.tar.gz -C .
      - name: Wire StudioFlow application
        run: python3 .staging/integrate.py
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete typecheck, build and test suite
        id: verify
        continue-on-error: true
        run: |
          npm test
          printf '{"code":"dns_proof_present"}' | python3 -B RISK/normalizer.py
      - name: Commit source integration to staging branch
        if: always()
        run: |
          rm -rf .staging/chunks .staging/security-center-v2-integrated.tar.gz .staging/security-center-v2-integrated.tar.gz.b64 .staging/integrate.py
          rm -f .github/workflows/integrate-security-center-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate StudioFlow Security Center V2 staging' || true
          git push origin HEAD:feat/studioflow-security-center-staging-v2
      - name: Preserve verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
