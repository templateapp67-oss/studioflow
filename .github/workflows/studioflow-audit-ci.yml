name: StudioFlow audit CI

on:
  push:
    branches:
      - audit/studioflow-end-to-end-autopsy-2026-11-06
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studioflow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, production build and offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full project verification
        run: npm test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
