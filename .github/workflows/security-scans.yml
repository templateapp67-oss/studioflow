name: Security scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Verify Semgrep reporting
        run: python -m unittest discover -s tests -p test_report_semgrep_ci.py

      - name: Scan application code for new findings
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE_COMMIT="$PR_BASE_SHA"
          else
            BASELINE_COMMIT="$PUSH_BASE_SHA"
          fi
          if [ -z "$BASELINE_COMMIT" ] || [[ "$BASELINE_COMMIT" =~ ^0+$ ]]; then
            BASELINE_COMMIT="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASELINE_COMMIT}^{commit}"
          # Keep Semgrep's exit status authoritative while surfacing its findings
          # as annotations (and retaining diagnostics if it cannot scan).
          scan_status=0
          semgrep scan --config p/default --error --metrics=off --baseline-commit "$BASELINE_COMMIT" --json \
            > "$RUNNER_TEMP/semgrep-results.json" 2> "$RUNNER_TEMP/semgrep-stderr.log" || scan_status=$?
          cat "$RUNNER_TEMP/semgrep-stderr.log"
          python scripts/report_semgrep_ci.py "$RUNNER_TEMP/semgrep-results.json" "$RUNNER_TEMP/semgrep-stderr.log" "$scan_status"
          exit "$scan_status"

  gitleaks:
    name: Gitleaks secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
