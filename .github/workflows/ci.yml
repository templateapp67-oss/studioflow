name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Razorpay key-mode helpers and tests
        run: deno lint supabase/functions/studioflow-payments/payment-security.ts supabase/functions/studioflow-payments/key-mode_test.ts

      - name: Test Razorpay server-side key-mode classification
        run: deno test supabase/functions/studioflow-payments/key-mode_test.ts

      - name: Parse and analyze the PowerShell E2E harness
        shell: pwsh
        run: |
          $path = 'scripts/Invoke-NexoraSalonE2E.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            throw 'PSResourceGet is required to install PSScriptAnalyzer without the legacy NuGet provider bootstrap.'
          }
          Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $issues = @(Invoke-ScriptAnalyzer -Path $path -Severity Error)
          if ($issues.Count -gt 0) {
            $issues | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PASS: PowerShell parser and PSScriptAnalyzer completed.'

      # package.json's mandatory "test" script runs lint, edge type checks,
      # the Vite/server build, and the complete project verification suite.
      - name: Run required tests, type checks and build
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  supabase-free-plan:
    name: Supabase Free Plan migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Free Plan has no GitHub PR preview database. Validate the same
      # migration and Edge Function contracts offline with PGlite; this job
      # never creates a Supabase branch or connects to production.
      - name: Verify WhatsApp test-mode contract
        run: node scripts/verify-whatsapp-booking-api.mjs

      - name: Verify Edge Function security boundaries
        run: node scripts/verify-edge-functions.mjs

      - name: Apply and verify SQL migrations offline
        run: node scripts/verify-sql-migrations.mjs
