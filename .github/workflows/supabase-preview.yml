name: Supabase Preview

# This optional check validates a separately configured preview database.
# Supabase's GitHub App manages automatic per-PR branches independently.
# When hosted validation is disabled, the required CI still checks migrations
# against its offline database. An explicitly enabled preview must be configured.
#
# Set SUPABASE_PREVIEW_ENABLED=true and provide the preview project ref,
# access token and DB password as SUPABASE_PREVIEW_* repository secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: supabase-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supabase-preview:
    name: Supabase Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Evaluate Supabase preview availability
        id: availability
        env:
          SUPABASE_PREVIEW_ENABLED: ${{ vars.SUPABASE_PREVIEW_ENABLED }}
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_PREVIEW_ACCESS_TOKEN: ${{ secrets.SUPABASE_PREVIEW_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${SUPABASE_PREVIEW_ENABLED:-false}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase preview is not enabled (repo variable SUPABASE_PREVIEW_ENABLED is not 'true')."
            {
              echo "## Supabase Preview — skipped (not enabled)"
              echo ""
              echo "Branch-preview validation is disabled by repository configuration."
              echo "The Supabase Free Plan has no GitHub PR preview database, so no branch"
              echo "preview is provisioned by default."
              echo ""
              echo "To enable real preview-DB validation on a plan that supports branch previews:"
              echo "1. Set repository variable **SUPABASE_PREVIEW_ENABLED** to `true`."
              echo "2. Add preview-scoped secrets **SUPABASE_PREVIEW_PROJECT_REF**,"
              echo "   **SUPABASE_PREVIEW_ACCESS_TOKEN** and **SUPABASE_PREVIEW_DB_PASSWORD**."
              echo ""
              echo "Migration, ledger, publish E2E and Edge Function contracts are still"
              echo "validated offline by the CI **Supabase Free Plan migration validation** job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          missing=()
          for name in SUPABASE_PREVIEW_PROJECT_REF SUPABASE_PREVIEW_ACCESS_TOKEN SUPABASE_PREVIEW_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Hosted Supabase Preview is enabled but missing configuration: ${missing[*]}."
            exit 1
          fi

          if [[ ! "$SUPABASE_PREVIEW_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Provide a preview project reference, without a URL or whitespace."
            exit 1
          fi

          case "$SUPABASE_PREVIEW_PROJECT_REF" in
            zilwgiuiygqqardzutxi|ckgrgnokgxgjxzfeoigg)
              echo "::error::The configured project is excluded from preview validation."
              exit 1
              ;;
          esac

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Hosted Supabase Preview configuration is present."

      - uses: actions/setup-node@v5
        if: steps.availability.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.availability.outputs.enabled == 'true'
        run: npm ci

      - name: Install Supabase CLI v3.0.0
        if: steps.availability.outputs.enabled == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Verify migration and Edge Function source contracts
        if: steps.availability.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node scripts/verify-supabase-migration-history.mjs
          node scripts/verify-whatsapp-release-plan.mjs
          node scripts/verify-edge-functions.mjs

      - name: Dry-run migrations against the preview database
        if: steps.availability.outputs.enabled == 'true'
        env:
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PREVIEW_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="$SUPABASE_PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Hosted preview migration dry-run passed." >> "$GITHUB_STEP_SUMMARY"
