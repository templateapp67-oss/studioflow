name: Vercel Preview

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional existing Vercel Preview URL (leave blank to build and deploy from this branch)
        required: false
        type: string

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  prepare-assets:
    name: Convert remaining template heroes and verify PR #162
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 162 && github.event.pull_request.head.ref == 'seo/technical-seo-checklist' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit-assets.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Install temporary Sharp image tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.4

      - name: Convert and verify the remaining four NEXORA hero images
        run: node scripts/convert-nexora-preview-heroes.mjs

      - name: Run lint, typecheck, production build and offline verification suite
        run: npm test

      - name: Run offline Supabase migration and publish validation
        run: |
          set -euo pipefail
          node scripts/verify-supabase-migration-history.mjs
          node scripts/verify-whatsapp-release-plan.mjs
          node scripts/verify-whatsapp-booking-api.mjs
          node scripts/verify-edge-functions.mjs
          node scripts/verify-sql-migrations.mjs
          node scripts/verify-publish-e2e.mjs

      - name: Commit generated WebP assets to PR #162
        id: commit-assets
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/templates/barber/hero.webp \
            public/templates/kesh-prakriti/hero-reference.webp \
            public/templates/12/media/studio-practice.webp \
            public/templates/13/preview.webp
          if git diff --cached --quiet; then
            echo "No generated WebP changes to commit."
          else
            git commit -m "optimize remaining NEXORA template preview heroes as WebP"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  preview:
    name: Deploy preview
    needs: [prepare-assets]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
      deploy_outcome: ${{ steps.deploy.outcome }}
      vercel_available: ${{ steps.vercel-config.outputs.available }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-assets.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check optional Vercel preview credentials
        id: vercel-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel Preview skipped because required secret(s) are unavailable: ${missing[*]}"
            {
              echo "### Vercel Preview skipped"
              echo "This does not block pull-request CI."
              echo "Unavailable secret names: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel preview credential fields are present."
          fi

      - uses: actions/setup-node@v5
        if: steps.vercel-config.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.vercel-config.outputs.available == 'true'
        run: npm ci

      - name: Install stable Vercel CLI
        if: steps.vercel-config.outputs.available == 'true'
        run: npm install --global vercel@65.14.0

      - name: Pull Vercel environment (preview)
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify linked Vercel project
        if: steps.vercel-config.outputs.available == 'true'
        env:
          EXPECTED_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          EXPECTED_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.vercel/project.json';
          if (!fs.existsSync(file)) {
            console.error('Vercel pull did not create .vercel/project.json.');
            process.exit(1);
          }
          const linked = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (linked.orgId !== process.env.EXPECTED_VERCEL_ORG_ID ||
              linked.projectId !== process.env.EXPECTED_VERCEL_PROJECT_ID) {
            console.error('Downloaded Vercel project identity does not match the configured GitHub IDs.');
            process.exit(1);
          }
          console.log('Downloaded project identity matches the configured team and project IDs.');

          NODE

      - name: Build preview
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT
          if url="$(vercel deploy --prebuilt --archive=tgz --yes --token="$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID" 2>"$deploy_log")"; then
            cat "$deploy_log" >&2
          else
            cat "$deploy_log" >&2
            node scripts/classify-preview-deploy-error.mjs "$deploy_log"
            exit 1
          fi
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report preview deployment failure
        if: always() && steps.vercel-config.outputs.available == 'true' && steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::Vercel preview deployment failed; Preview verification is blocked."
          {
            echo "### Vercel Preview not deployed"
            echo "The deployment command failed; see the Deploy preview step log for the Vercel error. Preview verification remains blocked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.vercel-config.outputs.available == 'true' && steps.deploy.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = marker + ' Preview ready: ' + process.env.PREVIEW_URL +
              ' (commit ' + context.sha.slice(0, 7) + ')';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Report preview URL in workflow summary
        if: steps.vercel-config.outputs.available == 'true' && steps.deploy.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Preview ready: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

  browser-e2e:
    name: Preview Browser E2E (Playwright)
    needs: [preview, prepare-assets]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-assets.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Install pinned Playwright and Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-runner
          cat > /tmp/pw-runner/package.json <<'EOF'
          {
            "private": true,
            "overrides": {
              "tldts": "7.4.19",
              "tldts-core": "7.4.19",
              "tldts-icann": "7.4.19"
            }
          }
          EOF
          npm install --prefix /tmp/pw-runner --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1 lighthouse@13.6.0
          /tmp/pw-runner/node_modules/.bin/playwright install chromium --with-deps
          /tmp/pw-runner/node_modules/.bin/playwright --version

      - name: Resolve Preview URL
        id: resolve-preview
        shell: bash
        env:
          DEPLOYED_PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url }}
          SECRET_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="${DEPLOYED_PREVIEW_URL:-${MANUAL_PREVIEW_URL:-}}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          if [[ -z "$url" ]]; then
            echo "::error::BLOCKED: No fresh Vercel Preview URL is available (deploy outcome: ${{ needs.preview.outputs.deploy_outcome || 'unknown' }}). Refusing to test an older deployment."
            {
              echo "### Preview browser audit blocked"
              echo "A fresh deployment for this commit is required. No previous Preview URL will be reused."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Resolved fresh Preview URL: $url"

          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            let bypass = (process.env.SECRET_BYPASS || '').trim();
            if (!bypass && process.env.VERCEL_TOKEN && process.env.VERCEL_PROJECT_ID) {
              const qs = process.env.VERCEL_ORG_ID ? `?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}` : '';
              const res = await fetch(`https://api.vercel.com/v9/projects/${encodeURIComponent(process.env.VERCEL_PROJECT_ID)}${qs}`, {
                headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
              });
              if (res.ok) {
                const proj = await res.json();
                const map = proj && typeof proj.protectionBypass === 'object' ? proj.protectionBypass : null;
                if (map) {
                  const keys = Object.keys(map).filter((k) => map[k]?.scope === 'automation-bypass' || !map[k]?.scope);
                  if (keys.length > 0) bypass = keys[0];
                }
              }
            }
            if (bypass) {
              console.log(`::add-mask::${bypass}`);
              if (process.env.GITHUB_ENV) {
                fs.appendFileSync(process.env.GITHUB_ENV, `VERCEL_AUTOMATION_BYPASS_SECRET=${bypass}\n`);
              }
              console.log('Vercel automation bypass secret is available (masked).');
            } else {
              console.log('No Vercel automation bypass secret found.');
            }
          }
          main().catch((err) => {
            console.log('Bypass lookup skipped:', err?.message || String(err));
          });
          NODE

      - name: Run read-only Playwright E2E against Preview
        id: storefront-e2e
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          PLAYWRIGHT_PACKAGE_ROOT: /tmp/pw-runner
          E2E_ARTIFACTS_DIR: test-results/preview-browser-e2e
        run: node scripts/verify-preview-browser-e2e.mjs

      - name: Audit all template images and interaction responsiveness
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          PLAYWRIGHT_PACKAGE_ROOT: /tmp/pw-runner
        run: node scripts/verify-nexora-interaction-responsiveness.mjs

      - name: Run Lighthouse mobile Core Web Vitals and SEO audit
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          PLAYWRIGHT_PACKAGE_ROOT: /tmp/pw-runner
          LIGHTHOUSE_REPORT_DIR: test-results/preview-lighthouse
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/audit-lighthouse-preview.mjs

      - name: Upload Lighthouse mobile report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-lighthouse-${{ github.run_id }}
          path: test-results/preview-lighthouse
          retention-days: 14
          if-no-files-found: warn

      - name: Verify Preview HTTP SEO headers, robots.txt, llms.txt, /partner-rewards, redirects and /sitemap.xml
        if: always() && steps.resolve-preview.outputs.url != ''
        env:
          LIVE_SEO_URL: ${{ steps.resolve-preview.outputs.url }}
          SEO_REPORT_PATH: test-results/preview-live-seo-report.json
          SEO_WAIT_RETRY_ATTEMPTS: "3"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CHECK_WWW_REDIRECT_URL: https://www.nexorasalon.online
          CHECK_HTTP_REDIRECT_ORIGINS: https://nexorasalon.online,https://www.nexorasalon.online
        run: node scripts/verify-live-seo-http.mjs

      - name: Publish Preview Live SEO Check Run summary
        uses: actions/github-script@v8
        if: always()
        continue-on-error: true
        with:
          script: |
            const fs = require('node:fs');
            const reportPath = 'test-results/preview-live-seo-report.json';
            if (!fs.existsSync(reportPath)) return;
            const reportRaw = fs.readFileSync(reportPath, 'utf8').slice(0, 60000);
            let status = 'UNKNOWN';
            try { status = JSON.parse(reportRaw).overallStatus || 'UNKNOWN'; } catch {}
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Preview Live SEO Verification',
              head_sha: headSha,
              status: 'completed',
              conclusion: status === 'PASS' ? 'success' : 'failure',
              output: {
                title: `Preview Live SEO Verification: ${status}`,
                summary: `Preview SEO HTTP check status: **${status}**`,
                text: '```json\n' + reportRaw + '\n```',
              },
            });

      - name: Capture Vercel runtime logs for failed storefront preview
        if: failure() && steps.resolve-preview.outputs.url != ''
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TEAM_SLUG: templateapp67-oss-projects
          VERCEL_HEAD_SHA: ${{ needs.prepare-assets.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const {
            PREVIEW_URL,
            VERCEL_TOKEN,
            VERCEL_PROJECT_ID,
            VERCEL_ORG_ID,
            VERCEL_TEAM_SLUG,
            VERCEL_HEAD_SHA,
          } = process.env;

          try {
          const headers = {
            Authorization: `Bearer ${VERCEL_TOKEN}`,
            Accept: 'application/json',
          };
          const teamScope = new URLSearchParams({
            teamId: VERCEL_ORG_ID,
            slug: VERCEL_TEAM_SLUG,
          });
          async function getJson(url, label) {
            const response = await fetch(url, { headers });
            const raw = await response.text();
            let payload = {};
            try { payload = raw ? JSON.parse(raw) : {}; } catch {}
            if (!response.ok) {
              const message = payload?.error?.message || payload?.message || 'Vercel API request failed';
              throw new Error(`${label} returned HTTP ${response.status}: ${String(message).slice(0, 500)}`);
            }
            return payload;
          }
          function redact(value) {
            return String(value || '')
              .replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]')
              .replace(/(authorization|token|secret|api[_-]?key)\s*[:=]\s*[^,\s]+/gi, '$1=[REDACTED]')
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email]')
              .replace(/(?:\+?91[-\s]?)?[6-9]\d{9}/g, '[phone]')
              .slice(0, 1500);
          }

          // List deployments by the exact PR head SHA, project and Preview target.
          // This avoids GET /v13/deployments/{hostname}, which returned 403 even
          // though the same token successfully built/deployed the Preview.
          const deploymentQuery = new URLSearchParams({
            projectId: VERCEL_PROJECT_ID,
            target: 'preview',
            state: 'READY',
            limit: '20',
            sha: VERCEL_HEAD_SHA,
            ...Object.fromEntries(teamScope.entries()),
          });
          const deploymentPayload = await getJson(
            `https://api.vercel.com/v7/deployments?${deploymentQuery}`,
            'Vercel Preview deployment list',
          );
          const deployments = Array.isArray(deploymentPayload.deployments)
            ? deploymentPayload.deployments
            : Array.isArray(deploymentPayload) ? deploymentPayload : [];
          const deploymentHost = new URL(PREVIEW_URL).host;
          const deployment = deployments.find((entry) => entry.url === deploymentHost);
          if (!deployment) {
            throw new Error(
              `Vercel Preview list returned ${deployments.length} READY deployment(s) for head SHA ${VERCEL_HEAD_SHA.slice(0, 12)}, but none matched ${deploymentHost}.`
            );
          }
          const deploymentId = deployment.uid || deployment.id;
          if (!deploymentId) throw new Error('Vercel Preview list entry returned no deployment ID.');

          const logUrl = `https://api.vercel.com/v1/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/deployments/${encodeURIComponent(deploymentId)}/runtime-logs?${teamScope}`;
          const response = await fetch(logUrl, { headers: { ...headers, Accept: 'application/stream+json' } });
          const rawLogs = await response.text();
          if (!response.ok) {
            let payload = {};
            try { payload = rawLogs ? JSON.parse(rawLogs) : {}; } catch {}
            const message = payload?.error?.message || payload?.message || 'Vercel runtime-log request failed';
            throw new Error(`Vercel Preview runtime-log lookup returned HTTP ${response.status}: ${String(message).slice(0, 500)}`);
          }

          // Runtime logs may be returned as a JSON array or newline-delimited JSON.
          let records = [];
          try {
            const payload = rawLogs ? JSON.parse(rawLogs) : [];
            records = Array.isArray(payload) ? payload : Array.isArray(payload.logs) ? payload.logs : [];
          } catch {
            records = rawLogs.split(/\r?\n/).filter(Boolean).flatMap((line) => {
              try { return [JSON.parse(line)]; } catch { return []; }
            });
          }
          const errors = records.filter((entry) =>
            ['error', 'fatal'].includes(String(entry.level || '').toLowerCase())
            || Number(entry.responseStatusCode) >= 500
          );
          console.log(`Vercel Preview runtime logs: deployment=${deploymentId}, returned=${records.length}, errorsOr5xx=${errors.length}`);
          for (const entry of errors.slice(0, 50)) {
            let requestPath = null;
            try { requestPath = entry.requestPath ? new URL(entry.requestPath, PREVIEW_URL).pathname : null; } catch {}
            console.log(JSON.stringify({
              timestampInMs: entry.timestampInMs || null,
              level: entry.level || null,
              requestMethod: entry.requestMethod || null,
              requestPath,
              responseStatusCode: entry.responseStatusCode || null,
              message: redact(entry.message),
            }));
          }
          if (!errors.length) console.log('No error/fatal/5xx runtime log entries were returned for this Preview deployment.');
          } catch (error) {
            const message = String(error?.message || error).slice(0, 500);
            console.log(`::warning::Vercel Preview runtime-log capture unavailable: ${message}`);
            console.log('Runtime-log capture is diagnostic-only; the primary Preview audit result is unchanged.');
          }
          NODE

      - name: Run NEXORA responsive marketing and owner-route browser audit
        id: responsive-audit
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          BROWSER_TOOLS_ROOT: /tmp/pw-runner
          RESPONSIVE_REPORT_PATH: test-results/preview-browser-e2e/responsive-report.json
        run: node scripts/verify-nexora-responsive-browser.mjs

      - name: Publish responsive audit status
        uses: actions/github-script@v8
        if: always()
        continue-on-error: true
        env:
          AUDIT_OUTCOME: ${{ steps.responsive-audit.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const outcome = process.env.AUDIT_OUTCOME || 'skipped';
            let report = {};
            try { report = JSON.parse(fs.readFileSync('test-results/preview-browser-e2e/responsive-report.json', 'utf8')); } catch {}
            const phase = ['hover-card', 'spa-seo', 'owner-storefront', 'public-route', 'startup-or-other'].includes(report.phase) ? report.phase : 'unknown';
            const kind = ['assertion', 'timeout', 'other'].includes(report.kind) ? report.kind : 'unknown';
            const line = Number.isInteger(report.line) && report.line > 0 && report.line < 10000 ? report.line : 'unknown';
            const passed = outcome === 'success' && report.status === 'PASS';
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Responsive Marketing Audit Report', head_sha: headSha,
              status: 'completed', conclusion: passed ? 'success' : 'failure',
              output: {
                title: `Responsive marketing audit: ${passed ? 'PASS' : 'FAIL'}`,
                summary: passed ? 'Responsive audit completed successfully.' : `Outcome: ${outcome}; phase: ${phase}; kind: ${kind}; script line: ${line}. See job logs for details.`,
              },
            });

      - name: Capture Vercel runtime logs after failed Preview audits
        if: failure() && steps.resolve-preview.outputs.url != ''
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.resolve-preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@65.14.0 logs "$PREVIEW_URL" \
            --token="$VERCEL_TOKEN" \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --since=30m --status-code=500 --limit=50 --json

      - name: Upload Playwright report, screenshots and traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-browser-e2e-${{ github.run_id }}
          path: test-results/preview-browser-e2e
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Browser E2E Check Run summary
        uses: actions/github-script@v8
        if: always()
        continue-on-error: true
        with:
          script: |
            const fs = require('node:fs');
            const summaryPath = 'test-results/preview-browser-e2e/summary.md';
            const reportPath = 'test-results/preview-browser-e2e/report.json';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').slice(0, 60000)
              : 'No summary.md generated.';
            const reportRaw = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').slice(0, 60000)
              : '{}';
            let status = 'UNKNOWN';
            try {
              status = JSON.parse(reportRaw).overallStatus || 'UNKNOWN';
            } catch {}
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Preview Browser E2E Report',
              head_sha: headSha,
              status: 'completed',
              conclusion: status === 'PASS' ? 'success' : 'failure',
              output: {
                title: `Preview Browser E2E: ${status}`,
                summary: summary + '\nThis report covers the read-only storefront smoke only; see Responsive Marketing Audit Report for the separate responsive audit.',
                text: '```json\n' + reportRaw + '\n```',
              },
            });
