name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Deploy preview
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check optional Vercel preview credentials
        id: vercel-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel Preview skipped because required secret(s) are unavailable: ${missing[*]}"
            {
              echo "### Vercel Preview skipped"
              echo "This does not block pull-request CI."
              echo "Unavailable secret names: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel preview credential fields are present."
          fi

      - uses: actions/setup-node@v5
        if: steps.vercel-config.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.vercel-config.outputs.available == 'true'
        run: npm ci

      - name: Install stable Vercel CLI
        if: steps.vercel-config.outputs.available == 'true'
        run: npm install --global vercel@65.14.0

      - name: Pull Vercel environment (preview)
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --team "$VERCEL_ORG_ID"

      - name: Verify linked Vercel project
        if: steps.vercel-config.outputs.available == 'true'
        env:
          EXPECTED_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          EXPECTED_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.vercel/project.json';
          if (!fs.existsSync(file)) {
            console.error('Vercel pull did not create .vercel/project.json.');
            process.exit(1);
          }
          const linked = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (linked.orgId !== process.env.EXPECTED_VERCEL_ORG_ID ||
              linked.projectId !== process.env.EXPECTED_VERCEL_PROJECT_ID) {
            console.error('Downloaded Vercel project identity does not match the configured GitHub IDs.');
            process.exit(1);
          }
          console.log('Downloaded project identity matches the configured team and project IDs.');
          NODE

      - name: Build preview
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN" --team "$VERCEL_ORG_ID"

      - name: Deploy preview
        id: deploy
        if: steps.vercel-config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" --team "$VERCEL_ORG_ID")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.vercel-config.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = marker + ' Preview ready: ' + process.env.PREVIEW_URL +
              ' (commit ' + context.sha.slice(0, 7) + ')';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
