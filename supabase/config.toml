# Public landing-page lead endpoint. It is reachable without a Supabase session
# (browser form POST) and validates input via honeypot + Turnstile + a salted
# shared rate-limit store, not a Supabase JWT. The gateway JWT check must stay
# disabled: a browser form submit carries no Authorization header, and enabling
# it would reject every genuine lead. Omitting this block would silently deploy
# with the gateway default (verify_jwt = true) and break the endpoint, so it is
# required for this function.
[functions.submit-landing-lead]
verify_jwt = false

# Owner connection uses a valid Supabase JWT and performs an explicit Auth getUser() check.
[functions.nexora-whatsapp-connect]
verify_jwt = true

# Provider webhooks have no Supabase JWT; handlers validate raw Meta/Razorpay signatures.
[functions.nexora-whatsapp-webhook]
verify_jwt = false

[functions.studioflow-payments]
verify_jwt = false

# The QA endpoint authenticates its dedicated bearer API key in the handler;
# that key is not a Supabase JWT. Browser user credentials are not accepted.
[functions.studioflow-whatsapp-booking]
verify_jwt = false

# Performs its own Supabase Auth getUser() check plus an RLS-scoped booking
# lookup and binds the recipient to the stored booking. The gateway JWT check
# must stay disabled: the browser sends a CORS preflight (OPTIONS) and the
# configuration probe uses GET, neither of which carries an Authorization
# header. Omitting this block would silently deploy with the gateway default
# (verify_jwt = true) and break both, so it is required for this function.
[functions.studioflow-booking-emails]
verify_jwt = false

# Tawk owner connection validates the Supabase user with Auth getUser() in the handler.
[functions.studioflow-tawk-connect]
verify_jwt = false

# Keep gateway JWT verification for these signed-in endpoints. Each
# handler also verifies the authenticated user and enforces its own scope.
[functions.nexora-mobile-qr]
verify_jwt = true

[functions.studioflow-service-ai-images]
verify_jwt = true

[functions.studioflow-campaign-whatsapp]
verify_jwt = true

[functions.studioflow-welcome-whatsapp]
verify_jwt = true

[auth]
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 25
token_verifications = 20
