services:
  evidence-normalizer:
    image: "${EVIDENCE_IMAGE:?Provide the reviewed image by immutable digest}"
    user: "65532:65532"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    cpus: 0.5
    mem_limit: 96m
    memswap_limit: 96m
    init: true
    stdin_open: true
    restart: "no"
    stop_grace_period: 2s
    logging:
      driver: "none"
